<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rush</title>
    <meta name="description"
      content="Get in touch with Rush Rafting Company. Contact us for bookings, inquiries, and more!">
    <meta name="author" content="Raphael Omonayin">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/blue.jpg" alt="wwr-blue">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Rush Rafting Company</h1>
            <p>Tropic Gallaria mall, plot269 Mohammad Buhari way</p>
            <p>Abuja, Nigeria</p>
            <p>+234 810 999 9906</p>
            <p><a href="mailto:info@rushrafting.com">info@rushrafting.com</a></p>
        </section>

        <section class="contact-content">
            <div class="contact-map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d120183.19287381416!2d7.367465901885979!3d9.024246820757897!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x104e745f4cd62fd9%3A0x53bd17b4a20ea12b!2sAbuja%2C%20Federal%20Capital%20Territory%2C%20Nigeria!5e1!3m2!1sen!2sus!4v1780654488915!5m2!1sen!2sus"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="johndoe@gmail.com">
                </div>

                <div class="form-group">
                    <label for="message-purpose">Message Purpose</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" id="radio-label" name="message-purpose"
                              value="general" checked>
                            General Inquiry
                        </label>
                        <label class="radio-label">
                            <input type="radio" id="radio-label" name="message-purpose"
                              value="reservation">
                            Reservation Question
                        </label>
                        <label class="radio-label">
                            <input type="radio" id="radio-label" name="message-purpose"
                              value="website">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" id="message" name="message" placeholder="Type here"
                      rows="5"></textarea>
                </div>

                <div class="form-group checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" id="checkbox-label" name="subscribe">
                        Please Subscribe to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <div class="employee-card">
                    <img src="images/employee1.png" alt="Employee Profile">
                    <p>Employee Profile</p>
                </div>
                <div class="employee-card">
                    <img src="images/employee2.png" alt="Employee Profile">
                    <p>Employee Profile</p>
                </div>
                <div class="employee-card">
                    <img src="images/employee3.png" alt="Employee Profile">
                    <p>Employee Profile</p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>©️2026 ♠️ Rush ♠️ Raphael Omonayin</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook Icon" width="50">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin-square.svg" alt="linkedln Icon" width="50">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram Icon" width="50">
            </a>
        </nav>
    </footer>

</body>

</html>
